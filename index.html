<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FU-Bookkeeping</title>
  <link rel="canonical" href="FU-Bookkeeping.html" />
  <style>
    html,body{height:100%;margin:0;background:#191717;overflow:hidden}
    #fuApp{width:100%;height:100%;border:0;display:block;background:#191717}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e5e7eb;font:15px system-ui;background:#191717;z-index:2}
  </style>
</head>
<body>
  <div id="boot">Öppnar FU-Bookkeeping…</div>
  <iframe id="fuApp" title="FU-Bookkeeping" src="FU-Bookkeeping.html"></iframe>
  <script>
    (function(){
      var frame=document.getElementById('fuApp');
      var boot=document.getElementById('boot');
      frame.addEventListener('load',function(){
        try{
          var doc=frame.contentDocument;
          if(!doc){boot.hidden=true;return;}
          if(!doc.getElementById('fuAuditAiAddonLoader')){
            var script=doc.createElement('script');
            script.id='fuAuditAiAddonLoader';
            script.src='auditai-addon.js';
            script.defer=true;
            doc.body.appendChild(script);
          }
          if(!doc.getElementById('fuAuditAiMailboxLoader')){
            var mailboxScript=doc.createElement('script');
            mailboxScript.id='fuAuditAiMailboxLoader';
            mailboxScript.src='auditai-mailboxes.js';
            mailboxScript.defer=true;
            doc.body.appendChild(mailboxScript);
          }
          boot.hidden=true;
        }catch(err){
          console.error('AuditAI add-on could not be loaded',err);
          boot.hidden=true;
        }
      });
    })();
  </script>
  <noscript><p><a href="FU-Bookkeeping.html">Öppna FU-Bookkeeping</a></p></noscript>
</body>
</html>
